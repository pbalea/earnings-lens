<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>earnings-lens</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --text: #e2e8f0;
      --muted: #8892a4;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --radius: 8px;
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ---- Header ---- */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-light);
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .add-form {
      display: flex;
      gap: 8px;
      flex: 1;
      max-width: 600px;
    }
    .add-form input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 7px 12px;
      font-size: 13px;
      outline: none;
    }
    .add-form input:focus { border-color: var(--accent); }
    .add-form input::placeholder { color: var(--muted); }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-light); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    /* ---- Layout ---- */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ---- Sidebar ---- */
    aside {
      width: 200px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px 8px;
    }
    aside h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding: 0 8px 8px;
    }
    .company-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid transparent;
    }
    .company-item:hover { background: var(--surface2); }
    .company-item.active {
      background: var(--surface2);
      border-color: var(--accent);
    }
    .ticker-badge {
      font-size: 11px;
      font-weight: 700;
      background: var(--surface2);
      color: var(--accent-light);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
    }
    .company-item.active .ticker-badge { background: var(--accent); color: #fff; border-color: var(--accent); }
    .company-name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---- Main panel ---- */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 8px;
    }
    .empty-state h3 { font-size: 16px; color: var(--text); }

    /* ---- Cards ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ---- Drift meter ---- */
    .drift-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .drift-score-num {
      font-size: 36px;
      font-weight: 800;
      min-width: 80px;
    }
    .drift-score-num.green { color: var(--green); }
    .drift-score-num.yellow { color: var(--yellow); }
    .drift-score-num.red { color: var(--red); }
    .drift-bar-wrap {
      flex: 1;
    }
    .drift-bar-track {
      background: var(--surface2);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .drift-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .drift-bar-fill.green { background: var(--green); }
    .drift-bar-fill.yellow { background: var(--yellow); }
    .drift-bar-fill.red { background: var(--red); }
    .drift-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
    }

    /* ---- Narrative ---- */
    .narrative-text {
      line-height: 1.65;
      color: var(--text);
      font-size: 13px;
    }

    /* ---- Topics table ---- */
    .topics-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .topics-table th {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .topics-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .topics-table tr:last-child td { border-bottom: none; }
    .topics-table tr.dropped { background: rgba(239,68,68,0.08); }
    .topics-table tr.new { background: rgba(34,197,94,0.08); }
    .topics-table tr.dropped .topic-label { color: var(--red); }
    .topics-table tr.new .topic-label { color: var(--green); }

    .delta { font-weight: 600; }
    .delta.pos { color: var(--green); }
    .delta.neg { color: var(--red); }
    .delta.zero { color: var(--muted); }

    .sentiment-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .sent-positive { background: rgba(34,197,94,0.15); color: var(--green); }
    .sent-neutral  { background: rgba(148,163,184,0.15); color: #94a3b8; }
    .sent-cautious { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .sent-negative { background: rgba(239,68,68,0.15); color: var(--red); }

    .tag-dropped { font-size: 10px; font-weight: 700; color: var(--red); background: rgba(239,68,68,0.12); padding: 1px 6px; border-radius: 4px; }
    .tag-new     { font-size: 10px; font-weight: 700; color: var(--green); background: rgba(34,197,94,0.12); padding: 1px 6px; border-radius: 4px; }

    /* ---- Alerts ---- */
    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .alert-item:last-child { border-bottom: none; }
    .alert-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .sev-high   { background: var(--red); }
    .sev-medium { background: var(--yellow); }
    .sev-low    { background: var(--green); }
    .alert-msg  { font-size: 13px; line-height: 1.5; }
    .alert-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .loading { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
    .error-msg { color: var(--red); font-size: 13px; padding: 8px 12px; background: rgba(239,68,68,0.1); border-radius: var(--radius); }

    .ingest-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .ingest-form input, .ingest-form select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }
    .ingest-form input:focus, .ingest-form select:focus { border-color: var(--accent); }
    .ingest-form input::placeholder { color: var(--muted); }
    .ingest-url { flex: 1; min-width: 200px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API = "";  // same origin

function useApi(path, deps = []) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const refetch = useCallback(() => {
    if (!path) { setLoading(false); return; }
    setLoading(true);
    fetch(API + path)
      .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
      .then(d => { setData(d); setError(null); })
      .catch(e => setError(e.message))
      .finally(() => setLoading(false));
  }, [path]);

  useEffect(() => { refetch(); }, [refetch, ...deps]);
  return { data, loading, error, refetch };
}

// ---------------------------------------------------------------------------
// Drift meter
// ---------------------------------------------------------------------------
function DriftMeter({ score }) {
  const pct = Math.round(score * 100);
  const cls = score < 0.2 ? "green" : score < 0.4 ? "yellow" : "red";
  return (
    <div className="drift-row">
      <div className={`drift-score-num ${cls}`}>{pct}<span style={{fontSize:18}}>%</span></div>
      <div className="drift-bar-wrap">
        <div className="drift-bar-track">
          <div className={`drift-bar-fill ${cls}`} style={{width: `${pct}%`}} />
        </div>
        <div className="drift-labels">
          <span>stable</span>
          <span>moderate</span>
          <span>major shift</span>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Sentiment pill
// ---------------------------------------------------------------------------
function SentimentPill({ s }) {
  const cls = { positive: "sent-positive", neutral: "sent-neutral", cautious: "sent-cautious", negative: "sent-negative" }[s] || "sent-neutral";
  return <span className={`sentiment-pill ${cls}`}>{s}</span>;
}

// ---------------------------------------------------------------------------
// Topics table
// ---------------------------------------------------------------------------
function TopicsTable({ diff }) {
  if (!diff) return null;
  const { matched = [], dropped = [], new_topics = [] } = diff;

  const fmt = v => v != null ? (v * 100).toFixed(1) + "%" : "—";
  const fmtDelta = d => {
    if (d == null) return "—";
    const s = (d > 0 ? "+" : "") + (d * 100).toFixed(1) + "%";
    const cls = d > 0.005 ? "pos" : d < -0.005 ? "neg" : "zero";
    return <span className={`delta ${cls}`}>{s}</span>;
  };

  const rows = [
    ...matched.map(t => ({ ...t, _type: "matched" })),
    ...dropped.map(t => ({ label: t.label, prev_weight: t.prev_weight, curr_weight: null, weight_delta: null, curr_sentiment: null, _type: "dropped" })),
    ...new_topics.map(t => ({ label: t.label, prev_weight: null, curr_weight: t.curr_weight, weight_delta: null, curr_sentiment: null, _type: "new" })),
  ];

  return (
    <table className="topics-table">
      <thead>
        <tr>
          <th>Topic</th>
          <th>Prev</th>
          <th>Curr</th>
          <th>Delta</th>
          <th>Sentiment</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {rows.map((row, i) => (
          <tr key={i} className={row._type === "dropped" ? "dropped" : row._type === "new" ? "new" : ""}>
            <td className="topic-label" style={{fontWeight:500}}>{row.label}</td>
            <td>{fmt(row.prev_weight)}</td>
            <td>{fmt(row.curr_weight)}</td>
            <td>{fmtDelta(row.weight_delta)}</td>
            <td>{row.curr_sentiment ? <SentimentPill s={row.curr_sentiment} /> : "—"}</td>
            <td>
              {row._type === "dropped" && <span className="tag-dropped">DROPPED</span>}
              {row._type === "new" && <span className="tag-new">NEW</span>}
            </td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

// ---------------------------------------------------------------------------
// Alerts panel
// ---------------------------------------------------------------------------
function AlertsPanel({ companyId }) {
  const { data: alerts, loading, error } = useApi("/alerts", []);
  const filtered = companyId && alerts ? alerts.filter(a => a.company_id === companyId) : (alerts || []);

  if (loading) return <div className="loading">Loading alerts…</div>;
  if (error) return <div className="error-msg">Failed to load alerts: {error}</div>;
  if (!filtered.length) return <p style={{color:"var(--muted)", fontSize:13}}>No alerts.</p>;

  return filtered.slice(0, 20).map(a => (
    <div key={a.id} className="alert-item">
      <div className={`alert-dot sev-${a.severity}`} />
      <div>
        <div className="alert-msg">{a.message}</div>
        <div className="alert-meta">{a.alert_type} · {a.severity} · {new Date(a.created_at).toLocaleString()}</div>
      </div>
    </div>
  ));
}

// ---------------------------------------------------------------------------
// Ingest transcript form
// ---------------------------------------------------------------------------
function IngestForm({ ticker, onDone }) {
  const [url, setUrl] = useState("");
  const [quarter, setQuarter] = useState("Q1");
  const [year, setYear] = useState(new Date().getFullYear());
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);

  const submit = async () => {
    setLoading(true); setError(null); setResult(null);
    try {
      const r = await fetch(API + "/transcripts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ticker, url, fiscal_quarter: quarter, fiscal_year: parseInt(year) }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || r.statusText);
      setResult(data);
      onDone();
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  return (
    <div className="card">
      <div className="card-title">Ingest Transcript for {ticker}</div>
      <div className="ingest-form">
        <input className="ingest-url" value={url} onChange={e => setUrl(e.target.value)} placeholder="Transcript URL (Motley Fool)" />
        <select value={quarter} onChange={e => setQuarter(e.target.value)}>
          {["Q1","Q2","Q3","Q4"].map(q => <option key={q}>{q}</option>)}
        </select>
        <input type="number" value={year} onChange={e => setYear(e.target.value)} style={{width:80}} min={2000} max={2100} />
        <button className="btn" onClick={submit} disabled={loading || !url}>
          {loading ? "Ingesting…" : "Ingest"}
        </button>
      </div>
      {error && <div className="error-msg" style={{marginTop:8}}>{error}</div>}
      {result && <div style={{marginTop:8, color:"var(--green)", fontSize:13}}>
        Ingested! Drift score: {result.comparison ? (result.comparison.drift_score * 100).toFixed(1) + "%" : "n/a (first transcript)"}
        {result.alerts_created > 0 && ` · ${result.alerts_created} alert(s) created`}
      </div>}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Main panel
// ---------------------------------------------------------------------------
function MainPanel({ company, onAnalysisRefetch }) {
  const [showIngest, setShowIngest] = useState(false);
  const { data: analysis, loading, error, refetch } = useApi(
    company ? `/companies/${company.ticker}/latest-analysis` : null,
    [company?.ticker]
  );

  if (!company) return (
    <div className="empty-state">
      <h3>Select a company</h3>
      <p>Add a company using the search bar above, then select it from the sidebar.</p>
    </div>
  );

  return (
    <>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:12}}>
        <div>
          <h2 style={{fontSize:20, fontWeight:700}}>{company.ticker}</h2>
          <p style={{color:"var(--muted)", fontSize:13}}>{company.name}{company.sector ? ` · ${company.sector}` : ""}</p>
        </div>
        <button className="btn btn-sm" onClick={() => setShowIngest(v => !v)}>
          {showIngest ? "Close" : "+ Ingest Transcript"}
        </button>
      </div>

      {showIngest && <IngestForm ticker={company.ticker} onDone={() => { setShowIngest(false); refetch(); onAnalysisRefetch(); }} />}

      {loading && <div className="loading">Loading analysis…</div>}
      {!loading && error && (
        <div className="empty-state">
          <h3>No analysis yet</h3>
          <p>Ingest at least two transcripts to generate a quarter-over-quarter comparison.</p>
        </div>
      )}

      {!loading && analysis && (
        <>
          <div className="card">
            <div className="card-title">Drift Score</div>
            <DriftMeter score={analysis.drift_score ?? 0} />
          </div>

          {analysis.narrative_summary && (
            <div className="card">
              <div className="card-title">Analyst Note</div>
              <p className="narrative-text">{analysis.narrative_summary}</p>
            </div>
          )}

          {analysis.diff_json && (
            <div className="card">
              <div className="card-title">Topics</div>
              <TopicsTable diff={analysis.diff_json} />
            </div>
          )}

          <div className="card">
            <div className="card-title">Alerts</div>
            <AlertsPanel companyId={company.id} />
          </div>
        </>
      )}
    </>
  );
}

// ---------------------------------------------------------------------------
// Add Company form (in header)
// ---------------------------------------------------------------------------
function AddCompanyForm({ onAdded }) {
  const [ticker, setTicker] = useState("");
  const [name, setName] = useState("");
  const [sector, setSector] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const submit = async (e) => {
    e.preventDefault();
    if (!ticker || !name) return;
    setLoading(true); setError(null);
    try {
      const r = await fetch(API + "/companies", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ticker: ticker.toUpperCase(), name, sector: sector || null }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || r.statusText);
      setTicker(""); setName(""); setSector("");
      onAdded(data);
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  return (
    <form className="add-form" onSubmit={submit}>
      <input value={ticker} onChange={e => setTicker(e.target.value)} placeholder="TICKER" style={{maxWidth:90, textTransform:"uppercase"}} />
      <input value={name} onChange={e => setName(e.target.value)} placeholder="Company name" />
      <input value={sector} onChange={e => setSector(e.target.value)} placeholder="Sector (optional)" style={{maxWidth:160}} />
      <button className="btn" type="submit" disabled={loading || !ticker || !name}>
        {loading ? "Adding…" : "Add Company"}
      </button>
      {error && <span style={{color:"var(--red)", fontSize:12}}>{error}</span>}
    </form>
  );
}

// ---------------------------------------------------------------------------
// App root
// ---------------------------------------------------------------------------
function App() {
  const [selected, setSelected] = useState(null);
  const [version, setVersion] = useState(0);    // bump to force sidebar refetch

  const { data: companies, loading: companiesLoading, refetch: refetchCompanies } = useApi("/companies", [version]);

  const handleAdded = (company) => {
    refetchCompanies();
    setSelected(company);
  };

  return (
    <>
      <header>
        <h1>earnings-lens</h1>
        <AddCompanyForm onAdded={handleAdded} />
      </header>
      <div className="layout">
        <aside>
          <h2>Companies</h2>
          {companiesLoading && <div className="loading">…</div>}
          {companies && companies.map(c => (
            <div
              key={c.id}
              className={`company-item ${selected?.id === c.id ? "active" : ""}`}
              onClick={() => setSelected(c)}
            >
              <div>
                <div className="ticker-badge">{c.ticker}</div>
                <div className="company-name">{c.name}</div>
              </div>
            </div>
          ))}
          {companies && companies.length === 0 && (
            <p style={{color:"var(--muted)", fontSize:12, padding:"8px 10px"}}>No companies yet.</p>
          )}
        </aside>
        <main>
          <MainPanel company={selected} onAnalysisRefetch={() => setVersion(v => v + 1)} />
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
